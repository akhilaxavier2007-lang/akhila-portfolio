<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#FF5E7E" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B5DE5" />
      <stop offset="100%" stop-color="#845EC2" />
    </linearGradient>
  </defs>
  
  <!-- Warm Cream Rounded Background -->
  <rect width="100" height="100" rx="28" fill="#FAF7F2" />
  
  <!-- Overlapping Playful Geometric Shapes -->
  <!-- Sunshine Yellow Pill -->
  <rect x="18" y="18" width="30" height="30" rx="15" fill="#FFD166" />
  
  <!-- Turquoise Blue Blob Shape -->
  <circle cx="70" cy="35" r="16" fill="#00F5D4" />
  
  <!-- Coral Pink Large Circle -->
  <circle cx="40" cy="62" r="22" fill="url(#coral-grad)" />
  
  <!-- Lavender Purple Starburst / Diamond -->
  <rect x="60" y="55" width="24" height="24" rx="8" transform="rotate(45 72 67)" fill="url(#purple-grad)" />
  
  <!-- Central Stylized 'AX' Monogram in Deep Charcoal -->
  <text x="50" y="61" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="28" fill="#1E2029" text-anchor="middle">AX</text>
</svg>
