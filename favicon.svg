<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warm cream background -->
  <rect width="64" height="64" rx="14" fill="#FAF6ED"/>
  <!-- Bold black border (neobrutalist) -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" stroke="#181824" stroke-width="3" fill="none"/>
  <!-- Hot pink background square offset -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="#FF1493"/>
  <!-- Yellow 4-point star top-right -->
  <polygon points="52,8 54,12 58,12 55,15 56,19 52,17 48,19 49,15 46,12 50,12" fill="#FFD600"/>
  <!-- White AX monogram -->
  <text x="32" y="43" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="-1">AX</text>
  <!-- Small cobalt blue dot decoration -->
  <circle cx="12" cy="52" r="4" fill="#1A56DB"/>
  <!-- Small orange dot -->
  <circle cx="52" cy="52" r="3" fill="#FF5400"/>
</svg>
